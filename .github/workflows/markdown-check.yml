name: Markdown Check

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/**'

jobs:
  markdown-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required documentation files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE
          test -f docs/README.md
