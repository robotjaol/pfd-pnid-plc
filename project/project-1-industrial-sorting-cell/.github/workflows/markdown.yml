name: Markdown Check

on:
  push:
  pull_request:

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required documentation
        run: |
          test -f README.md
          test -f docs/control-philosophy.md
          test -f docs/acceptance-test-plan.md
          test -f plc/ladder-networks.md
          test -f factoryio/tag-map.csv
